name: Owner request
description: Something the owner asked for, in any tool (Claude, Codex, AI Studio). The planner turns it into ledger rows and tickets.
title: "[ask] "
labels: ["owner-ask"]
body:
  - type: textarea
    id: words
    attributes:
      label: The owner's words
      description: Quote the request as given. Do not shorten or reinterpret it.
    validations:
      required: true
  - type: dropdown
    id: heard_in
    attributes:
      label: Heard in
      options: [Claude, Codex/GPT, Google AI Studio, GitHub (owner directly), other]
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      placeholder: 2026-11-27
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related ledger rows or tickets, if any
      description: For example A5, #64. Leave empty if unsure; the planner checks.
