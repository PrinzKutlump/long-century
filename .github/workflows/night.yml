name: night
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/night.yml

permissions:
  contents: read

jobs:
  build:
    name: Build nightly web and Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web app
        run: |
          npm run build
          test -s dist/index.html
          tar -czf long-century-nightly-web.tar.gz -C dist .
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 platform-tools build-tools;36.0.0
      - name: Build Android debug APK
        run: |
          npx --no-install cap sync android
          (cd android && bash gradlew --no-daemon assembleDebug)
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" long-century-nightly-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-builds
          path: |
            long-century-nightly-web.tar.gz
            long-century-nightly-debug.apk
          if-no-files-found: error
