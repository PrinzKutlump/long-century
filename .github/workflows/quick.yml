# Quick tier: every push to a branch other than main.
# Build, syntax check, and the engine tests listed in tests-quick.txt (each under 30 s).
# Seed 7 to 1866 is not run: century.js has no year limit yet.
name: quick
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          if python3 build.py > /tmp/build.log 2>&1; then
            echo "- PASS build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- FAIL build" >> "$GITHUB_STEP_SUMMARY"; tail -20 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
      - name: Syntax check (node --check)
        run: |
          fail=0
          for f in src/*.js; do
            if node --check "$f" > /tmp/check.log 2>&1; then
              echo "- PASS syntax $f" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- FAIL syntax $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -20 /tmp/check.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          exit $fail
      - name: Quick engine tests (under 30 s each)
        run: |
          fail=0
          mkdir -p /tmp/logs
          for f in $(grep -v '^#' tests-quick.txt | grep -v '^$'); do
            timeout 30 node "$f" > "/tmp/logs/$f.log" 2>&1
            rc=$?
            # Same rule as run_tests.js: a FAIL/FAILED/ERROR line counts even when the exit code is 0.
            if [ $rc -eq 0 ] && ! grep -qE '^(FAIL|FAILED|ERROR)\b' "/tmp/logs/$f.log"; then
              echo "- PASS $f" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- FAIL $f (exit $rc; 124 means the 30 s cap)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -20 "/tmp/logs/$f.log" | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-logs
          path: /tmp/logs/
          if-no-files-found: ignore
